schema_version: 1
experiment_id: vea_p1_canonical_224_cuda_v0
phase: P1

models:
  - clip_vit_b16
  - siglip2_base_p16_224
  - dinov3_vit_b16

dataset:
  manifest: data/manifests/canonical_1000.jsonl
  root_env: VEA_DATASET_ROOT
  expected_image_count: 1000
  on_missing_or_corrupt: error

preprocessing:
  protocol: canonical_224_center_crop_v0
  color_mode: RGB
  resize_shorter_side: 224
  crop_height: 224
  crop_width: 224
  interpolation: bicubic
  antialias: true
  random_augmentation: false
  numeric_normalization: model_specific

extraction:
  device: cuda
  batch_size: 32
  parameter_dtype: float32
  compute_dtype: float16
  storage_dtype: float16
  gradients: disabled
  model_mode: eval
  global_taps: all_comparable_blocks
  patch_taps_normalized_depth:
    - 0.25
    - 0.50
    - 0.75
    - 1.00

artifacts:
  schema_id: vea.feature_artifact.v0
  root: artifacts/runs
  format: safetensors_shards
  shard_size: 50
  checksum: sha256

randomness:
  seed: 20260712

requirements:
  exact_model_revisions_required: true
  fp32_smoke_equivalence_required: true
  nvidia_cuda_required: true
